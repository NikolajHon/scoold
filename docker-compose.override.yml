# Lokálne pre Mac (Apple Silicon): obraz Para nemá arm64 verziu,
# preto spúšťame Para ako amd64 cez emuláciu (Rosetta).
services:
  para:
    platform: linux/amd64
    # Para + plugin para-search-elasticsearch (1.43.1 pre Para 1.55.x = latest_stable, Elasticsearch 9.x), pozri ELASTICSEARCH.md.
    # Para načítava pluginy z para.plugin_folder (predvolene lib/); /para/lib je volume, preto /para/plugins.
    image: para-es:dev
    build:
      # Plugin 1.43.x má chybu: META-INF/services odkazuje na triedu ProxySubResourceHandler,
      # ktorá v jar-e už nie je -> Para spadne pri štarte. Riadok z jar-u odstránime.
      dockerfile_inline: |
        FROM eclipse-temurin:21-jdk AS plugin
        ADD https://repo1.maven.org/maven2/com/erudika/para-search-elasticsearch/1.43.1/para-search-elasticsearch-1.43.1-shaded.jar /tmp/es.jar
        RUN cd /tmp && F=META-INF/services/com.erudika.para.core.rest.CustomResourceHandler \
            && jar xf es.jar $$F && sed -i '/ProxySubResourceHandler/d' $$F && jar uf es.jar $$F
        FROM erudikaltd/para:latest_stable
        COPY --from=plugin /tmp/es.jar /para/plugins/para-search-elasticsearch.jar
    environment:
      - >-
        JAVA_OPTS=-Dconfig.file=/para/application.conf
        -Dloader.path=/para/lib
        -Dpara.plugin_folder=/para/plugins/
        -Dpara.search=ElasticSearch
        -Dpara.es.flavor=elasticsearch
        -Dpara.es.restclient_scheme=http
        -Dpara.es.restclient_host=elasticsearch
        -Dpara.es.restclient_port=9200
        -Dpara.es.shards=1
        -Dpara.es.replicas=0
    depends_on:
      keycloak:
        condition: service_started
      elasticsearch:
        condition: service_healthy
  scoold:
    # vlastný build z nášho forku (so slovenčinou), natívne arm64
    image: scoold-sos:dev
    build: .
    environment:
      # pod emuláciou Para štartuje pomalšie, Scoold musí počkať,
      # kým Para zapíše root kľúče do para-application.conf
      - BOOT_SLEEP=30
    depends_on:
      - para
      - slovlex

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    ports:
      - "8081:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      # issuer je vždy http://localhost:8081, aj keď Para volá Keycloak
      # interne cez http://keycloak:8080 (token + userinfo)
      - KC_HOSTNAME=http://localhost:8081
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HTTP_ENABLED=true
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Platforma SOS: prihlasovacia téma v štýle ID-SK (v start-dev sa nekešuje, zmeny vidno po obnovení stránky)
      - ./keycloak/themes/sos:/opt/keycloak/themes/sos:ro

  # Platforma SOS: karty právnych predpisov zo Slov-Lexu (scraper static.slov-lex.sk), interná služba
  slovlex:
    image: slovlex-service:dev
    build: ./slovlex-service
    ports:
      - "8090:8090"   # len pre lokálne testovanie API, v produkcii nepublikovať

  # Platforma SOS: demo portál (Spring Boot + Angular) so SSO s fórom cez Keycloak, pozri portal-demo/README.md
  portal:
    image: sos-portal-demo:dev
    build: ./portal-demo
    ports:
      - "8082:8082"
    environment:
      - KC_PUBLIC=http://localhost:8081
      - KC_INTERNAL=http://keycloak:8080
      - PUBLIC_URL=http://localhost:8082
      - FORUM_URL=http://localhost:8000
      - CSRU_URL=http://csru-mock:8091
    depends_on:
      - keycloak
      - csru-mock

  # Platforma SOS: mock služieb IS CSRÚ (Evidencia ŤZP, PPnO, Register sociálnych služieb), pozri csru-mock/README.md
  csru-mock:
    image: csru-mock:dev
    build: ./csru-mock
    ports:
      - "8091:8091"   # prehľad a XML odpovede na http://localhost:8091

  # Platforma SOS: vyhľadávanie (index), dáta ostávajú v databáze Pary
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-9.1.0}
    environment:
      - discovery.type=single-node
      # len lokálny vývoj: bez hesla a HTTPS (v produkcii zapnúť security)
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"   # len na lokálne testovanie, v produkcii nepublikovať
    volumes:
      - esData:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: always

volumes:
  esData:
