idsk.static.placeholder.title = Pripravuje sa
idsk.static.placeholder = Toto je z\u00e1stupn\u00fd text. \u00dapln\u00e9 znenie tohto dokumentu dopln\u00ed prev\u00e1dzkovate\u013e slu\u017eby.
