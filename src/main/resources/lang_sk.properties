idsk.about.intro = T\u00e1to platforma sl\u00fa\u017ei na zdie\u013eanie znalost\u00ed a spolupr\u00e1cu formou ot\u00e1zok a odpoved\u00ed.
idsk.about.purpose4 = pomoc kolegom a ostatn\u00fdm pou\u017e\u00edvate\u013eom.
idsk.about.structure = Inform\u00e1cie s\u00fa usporiadan\u00e9 okolo ot\u00e1zok. Ot\u00e1zka m\u00f4\u017ee by\u0165 konkr\u00e9tna alebo m\u00f4\u017ee otv\u00e1ra\u0165 diskusiu na ur\u010dit\u00fa t\u00e9mu. Pod ka\u017edou ot\u00e1zkou n\u00e1jdete odpovede a autor ot\u00e1zky m\u00f4\u017ee odpove\u010f, ktor\u00e1 mu najviac pomohla, ozna\u010di\u0165 ako prijat\u00fa.
idsk.about.questions.1 = Pred polo\u017een\u00edm novej ot\u00e1zky ju sk\u00faste vyh\u013eada\u0165 \u2013 na podobn\u00fa ot\u00e1zku u\u017e mo\u017eno existuje odpove\u010f. Na svoju vlastn\u00fa ot\u00e1zku m\u00f4\u017eete odpoveda\u0165 aj sami, ak odpove\u010f pozn\u00e1te, a pom\u00f4c\u0165 tak ostatn\u00fdm. Duplicitn\u00e9 ot\u00e1zky m\u00f4\u017eu moder\u00e1tori uzavrie\u0165 alebo odstr\u00e1ni\u0165.
idsk.about.questions.2 = Ot\u00e1zka m\u00f4\u017ee by\u0165 uzavret\u00e1, napr\u00edklad ak je duplicitn\u00e1 s inou ot\u00e1zkou alebo je nevhodn\u00e1. K uzavretej ot\u00e1zke nemo\u017eno prid\u00e1va\u0165 nov\u00e9 odpovede, \u00fapravy v\u0161ak zost\u00e1vaj\u00fa mo\u017en\u00e9.
idsk.about.answers.1 = Odpovede mo\u017eno prid\u00e1va\u0165 ku ka\u017edej ot\u00e1zke, ktor\u00e1 nie je uzavret\u00e1. Autor ot\u00e1zky m\u00f4\u017ee jednu odpove\u010f ozna\u010di\u0165 ako prijat\u00fa \u2013 mala by to by\u0165 t\u00e1, ktor\u00e1 mu najviac pomohla. Neprid\u00e1vajte odpovede, ktor\u00e9 maj\u00fa len jedno alebo dve slov\u00e1, tie patria sk\u00f4r do koment\u00e1rov.
idsk.about.comments.1 = Koment\u00e1re mo\u017eno prid\u00e1va\u0165 k ot\u00e1zkam aj odpovediam. V\u0161etko, \u010do je na odpove\u010f pr\u00edli\u0161 kr\u00e1tke, by malo by\u0165 koment\u00e1rom \u2013 napr\u00edklad dopl\u0148uj\u00faca ot\u00e1zka, n\u00e1vrh alebo oprava. Nevhodn\u00e9 koment\u00e1re m\u00f4\u017eu moder\u00e1tori odstr\u00e1ni\u0165.
idsk.about.reports.1 = Ak si v\u0161imnete ak\u00fdko\u013evek probl\u00e9m, nahl\u00e1ste ho pomocou mo\u017enosti nahl\u00e1senia pri pr\u00edspevku. Patria sem chyby, ch\u00fdbaj\u00face alebo nespr\u00e1vne inform\u00e1cie, ur\u00e1\u017eliv\u00e9 \u010di diskrimina\u010dn\u00e9 spr\u00e1vanie alebo zverejnen\u00e9 osobn\u00e9 \u00fadaje. Nahl\u00e1senia posudzuj\u00fa moder\u00e1tori.
idsk.about.accounts.1 = Ak chcete kl\u00e1s\u0165 ot\u00e1zky, odpoveda\u0165 a komentova\u0165, prihl\u00e1ste sa svoj\u00edm \u00fa\u010dtom. Va\u0161a e-mailov\u00e1 adresa sa ostatn\u00fdm pou\u017e\u00edvate\u013eom nezobrazuje. Podrobnosti o sprac\u00favan\u00ed osobn\u00fdch \u00fadajov n\u00e1jdete na str\u00e1nke o ochrane osobn\u00fdch \u00fadajov.
idsk.static.contact = Kontaktn\u00e9 \u00fadaje prev\u00e1dzkovate\u013ea (e-mail, telef\u00f3n, adresa) dopln\u00ed prev\u00e1dzkovate\u013e.
