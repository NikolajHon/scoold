about.voterep.6 = Ak niekto hlasuje za v\u00e1\u0161 koment\u00e1r, sp\u00e4tn\u00fa v\u00e4zbu alebo preklad, z\u00edskate:
about.voterep.7 = Ak je va\u0161a odpove\u010f schv\u00e1len\u00e1, z\u00edskate:
