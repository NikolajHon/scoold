about.reports.1 = Ak si v Scoold v\u0161imnete ak\u00fdko\u013evek probl\u00e9m, nahl\u00e1ste ho! Patria sem chyby, ch\u00fdbaj\u00face alebo nespr\u00e1vne inform\u00e1cie, ur\u00e1\u017eliv\u00e9, diskrimina\u010dn\u00e9 alebo zneu\u017e\u00edvaj\u00face spr\u00e1vanie. Ka\u017ed\u00e9 nahl\u00e1senie n\u00e1m pom\u00e1ha udr\u017ea\u0165 Scoold pr\u00edjemn\u00fdm a priate\u013esk\u00fdm miestom.
about.reports.2 = Tu uvid\u00edte r\u00f4zne nahl\u00e1senia probl\u00e9mov na str\u00e1nke od pou\u017e\u00edvate\u013eov, napr\u00edklad spam alebo ur\u00e1\u017eliv\u00e9 spr\u00e1vanie. Syst\u00e9m tie\u017e vytvor\u00ed nahl\u00e1senie v\u017edy, ke\u010f si nie\u010do vy\u017eaduje va\u0161u pozornos\u0165.
about.accounts.1 = Na pou\u017e\u00edvanie Scoold sa nemus\u00edte registrova\u0165 \u2014 jednoducho sa prihl\u00e1site svoj\u00edm \u00fa\u010dtom zo soci\u00e1lnej siete. Pri prvom prihl\u00e1sen\u00ed od v\u00e1s budeme chcie\u0165 len meno a e-mailov\u00fa adresu. S\u013eubujeme, \u017ee v\u00e1\u0161 e-mail ochr\u00e1nime a nikdy v\u00e1m nepo\u0161leme ni\u010d, \u010do nie je naozaj d\u00f4le\u017eit\u00e9.
about.feedback.1 = V sekcii sp\u00e4tnej v\u00e4zby n\u00e1m m\u00f4\u017eete poveda\u0165, \u010do si o str\u00e1nke mysl\u00edte. M\u00f4\u017eete sa tu tie\u017e op\u00fdta\u0165 \u010doko\u013evek o samotnej str\u00e1nke, podrobne op\u00edsa\u0165 probl\u00e9my, s ktor\u00fdmi ste sa stretli, alebo navrhn\u00fa\u0165 zlep\u0161enia. Ak si teda mysl\u00edte, \u017ee n\u00e1m tu nie\u010do ch\u00fdba, nap\u00ed\u0161te n\u00e1m!

