about.scoold.1 = Scoold je open source platforma na zdie\u013eanie znalost\u00ed a spolupr\u00e1cu. In\u0161pirovali ju StackOverflow.com a str\u00e1nky z rodiny Stack Exchange a \u013eud\u00ed, ktor\u00ed za nimi stoja, si nesmierne v\u00e1\u017eime.
about.scoold.2 = Ide predov\u0161etk\u00fdm o:
about.scoold.3 = u\u010denie sa nov\u00fdch vec\u00ed,
about.scoold.4 = zdie\u013eanie znalost\u00ed,
about.scoold.5 = zhroma\u017e\u010fovanie a usporiadanie inform\u00e1ci\u00ed,
about.scoold.6 = pomoc kolegom a z\u00edskavanie bodov reput\u00e1cie.
about.scoold.7 = Inform\u00e1cie s\u00fa usporiadan\u00e9 okolo ot\u00e1zok. Ot\u00e1zky m\u00f4\u017eu by\u0165 konkr\u00e9tne alebo m\u00f4\u017eu ma\u0165 podobu diskusie na ur\u010dit\u00fa t\u00e9mu. Pod ka\u017edou ot\u00e1zkou s\u00fa odpovede zoraden\u00e9 pod\u013ea hlasov. Po\u010det hlasov vyjadruje kvalitu odpoved\u00ed aj ot\u00e1zok. Takmer za ka\u017ed\u00fd pr\u00edspevok sa d\u00e1 hlasova\u0165 za (+) alebo proti (-).
about.questions.9 = Na svoju vlastn\u00fa ot\u00e1zku m\u00f4\u017eete samozrejme v\u017edy odpoveda\u0165 aj sami, ak odpove\u010f pozn\u00e1te. Pom\u00f4\u017eete tak ostatn\u00fdm a z\u00e1rove\u0148 z\u00edskate body. M\u00f4\u017eete polo\u017ei\u0165 \u013eubovo\u013en\u00fd po\u010det ot\u00e1zok, no nezab\u00fadajte, \u017ee za duplicitn\u00e9 ot\u00e1zky m\u00f4\u017eu ostatn\u00ed hlasova\u0165 proti alebo m\u00f4\u017eu by\u0165 aj vymazan\u00e9.
about.questions.10 = V\u0161etko, \u010do sa t\u00fdka samotnej str\u00e1nky, patr\u00ed do sekcie \u201eSp\u00e4tn\u00e1 v\u00e4zba\u201c. Tam m\u00f4\u017eete prid\u00e1va\u0165 v\u0161etky ot\u00e1zky, n\u00e1vrhy, v\u0161eobecn\u00fa sp\u00e4tn\u00fa v\u00e4zbu alebo po\u017eiadavky na nov\u00e9 funkcie t\u00fdkaj\u00face sa str\u00e1nky.
about.questions.11 = Ot\u00e1zka m\u00f4\u017ee by\u0165 uzavret\u00e1 z r\u00f4znych d\u00f4vodov \u2014 m\u00e1 pr\u00edli\u0161 ve\u013ea odpoved\u00ed, je duplicitn\u00e1 s inou ot\u00e1zkou alebo je jednoducho nevhodn\u00e1. Uzavretie ot\u00e1zky znamen\u00e1, \u017ee k nej nemo\u017eno prid\u00e1va\u0165 nov\u00e9 odpovede, \u00fapravy v\u0161ak zost\u00e1vaj\u00fa mo\u017en\u00e9. Ot\u00e1zka sa automaticky ozna\u010d\u00ed na uzavretie, ke\u010f dosiahne -5 hlasov.
about.questions.12 = Ot\u00e1zky m\u00f4\u017ee upravova\u0165 ka\u017ed\u00fd, kto m\u00e1 odznak \u201eU\u010dite\u013e\u201c.
about.answers.1 = Odpovede mo\u017eno prid\u00e1va\u0165 ku ka\u017edej ot\u00e1zke, ktor\u00e1 e\u0161te nebola uzavret\u00e1. Dobr\u00e9 odpovede s\u00fa v\u017edy navrchu a autor ot\u00e1zky m\u00f4\u017ee jednu z nich schv\u00e1li\u0165 ako najlep\u0161iu. Schv\u00e1len\u00e1 odpove\u010f by mala by\u0165 t\u00e1, ktor\u00e1 autorovi ot\u00e1zky najviac pomohla, nie t\u00e1 s najv\u00e4\u010d\u0161\u00edm po\u010dtom hlasov. Neprid\u00e1vajte odpovede, ktor\u00e9 maj\u00fa len jedno alebo dve slov\u00e1. Tie patria sk\u00f4r do koment\u00e1rov (pozri Koment\u00e1re).
about.answers.2 = Odpovede m\u00f4\u017ee upravova\u0165 ka\u017ed\u00fd, kto m\u00e1 odznak \u201eNov\u00e1\u010dik\u201c.
about.revisions.1 = Pri ka\u017edej \u00faprave ot\u00e1zky alebo odpovede sa vytvor\u00ed nov\u00e1 verzia. Verzie zaznamen\u00e1vaj\u00fa v\u0161etky zmeny v texte, n\u00e1zve a \u0161t\u00edtkoch ot\u00e1zok a odpoved\u00ed. Prv\u00e1 verzia je p\u00f4vodn\u00e1. \u010eal\u0161ia \u00faprava vytvor\u00ed verziu \u010d. 1, potom \u010d. 2 a tak \u010falej.
about.revisions.2 = V\u017edy sa m\u00f4\u017eete vr\u00e1ti\u0165 k p\u00f4vodnej alebo k akejko\u013evek inej verzii. Obnoven\u00edm p\u00f4vodnej verzie sa nevyma\u017e\u00fa \u017eiadne predch\u00e1dzaj\u00face verzie, ale vytvor\u00ed sa nov\u00e1 verzia s obnoven\u00fdm p\u00f4vodn\u00fdm textom.
about.comments.1 = Koment\u00e1re mo\u017eno prid\u00e1va\u0165 ku v\u0161etk\u00fdm ot\u00e1zkam a odpovediam. V\u0161etko, \u010do je na odpove\u010f pr\u00edli\u0161 kr\u00e1tke, by malo by\u0165 koment\u00e1rom. Koment\u00e1re m\u00f4\u017eu obsahova\u0165 aj n\u00e1vrhy, opravy alebo kritiku. Za zl\u00e9 koment\u00e1re ostatn\u00ed hlasuj\u00fa proti a ke\u010f dosiahnu -5 hlasov, automaticky sa skryj\u00fa.
about.comments.2 = Koment\u00e1re m\u00f4\u017ee prid\u00e1va\u0165 ka\u017ed\u00fd, kto m\u00e1 odznak \u201eNad\u0161enec\u201c.
about.voterep.1 = Hlasovanie je neoddelite\u013enou s\u00fa\u010das\u0165ou Scoold. Ak sa v\u00e1m nie\u010do p\u00e1\u010di, je u\u017eito\u010dn\u00e9 alebo zauj\u00edmav\u00e9, hlasujte za. Jasne a dobre nap\u00edsan\u00e9 ot\u00e1zky by tie\u017e mali dosta\u0165 +1. To ist\u00e9 plat\u00ed pre u\u017eito\u010dn\u00e9 odpovede. Ak je nie\u010do zle nap\u00edsan\u00e9, nejasn\u00e9, nezdvoril\u00e9 alebo nevhodn\u00e9, hlasujte proti.
about.voterep.2 = Va\u0161e body reput\u00e1cie ukazuj\u00fa, nako\u013eko v\u00e1m ostatn\u00ed d\u00f4veruj\u00fa a v\u00e1\u017eia si v\u00e1s. Body z\u00edskavate za dobr\u00e9 ot\u00e1zky a odpovede. Ude\u013euj\u00fa sa aj spolu s niektor\u00fdmi odznakmi.
about.voterep.3 = Hlasovanie je prepojen\u00e9 s reput\u00e1ciou. Body z\u00edskate, ke\u010f niekto hlasuje za v\u00e1\u0161 pr\u00edspevok, a str\u00e1cate ich, ke\u010f niekto hlasuje proti nemu. Hlasovanie proti v\u00e1s stoj\u00ed 1 bod.
