about.voterep.10 = Ak hlasujete proti nie\u010domu, strat\u00edte:
about.badges.1 = Odznaky dost\u00e1vaj\u00fa len t\u00ed, ktor\u00ed si ich zasl\u00fa\u017eia. Priate\u013esk\u00fd a \u00factiv\u00fd pr\u00edstup k ostatn\u00fdm v\u00e1m v\u017edy prinesie odznaky aj body. Bu\u010fte teda mil\u00ed a z\u00edskajte niektor\u00e9 z t\u00fdchto odznakov:
