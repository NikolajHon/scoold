idsk.about.intro = This platform is a place for sharing knowledge and working together through questions and answers.
idsk.about.purpose4 = helping colleagues and other users.
idsk.about.structure = Information is organised around questions. A question can be specific or it can open a discussion on a particular topic. Answers are listed under each question, and the author of the question can mark the answer that helped them most as accepted.
idsk.about.questions.1 = Before asking a new question, try searching for it \u2013 a similar question may already have an answer. You can also answer your own question if you know the answer, and help others that way. Duplicate questions may be closed or removed by moderators.
idsk.about.questions.2 = A question can be closed, for example when it duplicates another question or is inappropriate. No new answers can be added to a closed question, but it can still be edited.
idsk.about.answers.1 = Answers can be added to any question that has not been closed. The author of the question can mark one answer as accepted \u2013 it should be the one that helped them most. Please do not post answers of only one or two words; those belong in comments.
idsk.about.comments.1 = Comments can be added to questions and answers. Anything too short to be an answer should be a comment \u2013 for example a follow-up question, a suggestion or a correction. Inappropriate comments may be removed by moderators.
idsk.about.reports.1 = If you notice any problem, please report it using the report option next to the post. This includes errors, missing or incorrect information, offensive or discriminatory behaviour, or published personal data. Reports are reviewed by moderators.
idsk.about.accounts.1 = To ask questions, answer and comment, sign in with your account. Your email address is not shown to other users. Details on how personal data is processed are available on the privacy page.
