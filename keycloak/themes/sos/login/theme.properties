# Platforma SOS – prihlasovacia téma Keycloaku v štýle ID-SK 3.0
# Dedí šablóny a správy z témy "keycloak" (v1), mení len layout (template.ftl), CSS triedy a štýly.
parent=keycloak
import=common/keycloak

# PatternFly sa nenačítava – štýly sú z ID-SK 3.0 (rovnaký súbor ako vo fóre) + úpravy pre Keycloak
